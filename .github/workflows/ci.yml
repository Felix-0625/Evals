name: Evals CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/repository_check.py
      - run: uv build --wheel --out-dir artifacts/wheels

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine/inspect_ai/src/inspect_ai/_view/ts-mono
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: "11.22.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run generate:css
      - run: pnpm check
      - run: pnpm -r --workspace-concurrency=2 --if-present run test --maxWorkers=2
      - run: pnpm --filter @meridianlabs/log-viewer build
      - run: pnpm --filter scout exec vite build
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level=moderate
